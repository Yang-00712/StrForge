name: Browser startup checks
on:
  push:
    branches: [main, fix/browser-startup]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Unit checks
        run: node --test tools/startup-unit.test.mjs tools/startup-baseline.test.mjs
      - name: Prepare complete isolated historical baseline
        timeout-minutes: 3
        run: |
          baseline_commit="$(node --input-type=module -e "import { BASELINE_COMMIT } from './tools/startup-baseline.mjs'; process.stdout.write(BASELINE_COMMIT)")"
          [[ "$baseline_commit" =~ ^[a-f0-9]{40}$ ]]
          baseline_root="$(mktemp -d "$RUNNER_TEMP/strforge-baseline.XXXXXX")"
          git -C "$baseline_root" init --quiet
          git -C "$baseline_root" -c fetch.fsckObjects=true fetch --no-tags --depth=1 https://github.com/Yang-00712/StrForge.git "$baseline_commit"
          git -C "$baseline_root" -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git -C "$baseline_root" rev-parse HEAD)" = "$baseline_commit"
          echo "STARTUP_BASELINE_ROOT=$baseline_root" >> "$GITHUB_ENV"
      - name: Install isolated browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/startup-tools"
          npm install --prefix "$RUNNER_TEMP/startup-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node "$RUNNER_TEMP/startup-tools/node_modules/playwright/cli.js" install --with-deps chromium webkit > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/browser-install.log"; exit 1; }
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/startup-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Check payload integrity and cold/warm startup
        run: node tools/startup-check.mjs
      - name: Check old-cache upgrade, failure recovery and slow loading
        run: node tools/startup-recovery.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: startup-report
          path: startup-report/
          retention-days: 7
